name: GitHub Pages preview
on:
  push:
    branches-ignore: [main, gh-pages]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - run: node scripts/assets/prepare-github-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish shared preview
        id: deployment
        uses: actions/deploy-pages@v4
